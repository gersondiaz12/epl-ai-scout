# Local Postgres with pgvector for apps/api. Start with: npm run db:up
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: epl_scout
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d epl_scout"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
